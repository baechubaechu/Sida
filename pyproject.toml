[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sida"
version = "0.2.0"
description = "CLI assistant for architectural design reasoning (Conductor + specialist modules)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "requests>=2.31,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[tool.setuptools]
py-modules = [
  "chat",
  "hub",
  "session",
  "commands",
  "conductor",
  "briefs",
  "console",
  "harness",
  "project",
  "i18n",
  "setup_env",
  "run",
  "state_updater",
  "ollama_boot",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "tests/_fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
