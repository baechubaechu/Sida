[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sida"
version = "0.2.0"
description = "Local web assistant for architectural design reasoning (Conductor + specialist modules)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "requests>=2.31,<3",
  "olefile>=0.46,<1",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9",
  "PyJWT[crypto]>=2.8,<3",
  "ezdxf>=1.3,<2",
  "rhino3dm>=8.4,<9",
  "numpy>=1.24",
  "shapely>=2.0,<3",
  "contourpy>=1.2,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-xdist>=3.5",
  "ruff>=0.5",
  "httpx>=0.27,<1",
  "pyshp>=2.3",  # tests write tiny map shapefiles (scripts/build_terrain_pack.py)
]
# scripts/build_terrain_pack.py only: reading the map shapefiles and their projection
pack = [
  "pyshp>=2.3",
  "pyproj>=3.6",
]

[tool.setuptools.packages.find]
include = ["sida*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
# extend-exclude keeps ruff's own list (venv, site-packages, node_modules); _logs is local scratch
extend-exclude = ["_logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
