<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#36536b">
  <meta name="description" content="Sida — 건축 설계 프로젝트와 전문가 대화의 인터랙티브 UI 목업">
  <title>Sida · 프로젝트</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 이동</a>
  <div id="app"></div>
  <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <form method="dialog">
      <div class="dialog-heading"><h2 id="settings-title">테스트 목업 안내</h2><button class="icon-button" aria-label="안내 닫기">×</button></div>
      <p>피그마 화면의 구성과 사용 흐름을 확인하는 테스트 페이지입니다.</p>
      <p>프로젝트와 대화는 이 브라우저에만 저장됩니다. 채팅은 샘플 응답이며, 파일은 이름만 표시됩니다.</p>
      <p class="muted">실제 AI 분석과 기존 Sida 프로젝트 연결은 아직 제공하지 않습니다.</p>
      <button class="primary">확인</button>
    </form>
  </dialog>
  <dialog id="delete-project-dialog" aria-labelledby="delete-project-title" aria-describedby="delete-project-description">
    <form method="dialog">
      <h2 id="delete-project-title">프로젝트를 삭제할까요?</h2>
      <p id="delete-project-description"></p>
      <p class="muted">이 브라우저에 저장된 프로젝트와 모든 대화가 함께 삭제됩니다. 삭제한 내용은 되돌릴 수 없습니다.</p>
      <div class="form-actions">
        <button class="secondary" value="cancel" autofocus>취소</button>
        <button class="danger" value="delete">프로젝트 삭제</button>
      </div>
    </form>
  </dialog>
</body>
</html>
