name: Delete merged branches

# 머지된 PR의 원격 브랜치를 주기적으로 삭제합니다.
# auto-merge.yml은 GITHUB_TOKEN으로 머지하는데, 이렇게 머지된 PR은 다른 워크플로를
# 실행시키지 않고 저장소 설정의 자동 삭제도 동작하지 않아서 주기 실행으로 정리합니다.
# 머지 후 같은 브랜치에 새 커밋이 올라왔으면 지우지 않습니다.
on:
  schedule:
    - cron: "0 * * * *"   # 매시 정각 (GitHub 사정으로 늦어질 수 있음)
  workflow_dispatch:       # Actions 탭에서 수동 실행
  pull_request:
    types: [closed]        # 사람이 직접 머지한 경우 바로 정리

permissions:
  contents: write
  pull-requests: read
  actions: write   # 소개 페이지 반영(deploy-site.yml) 실행

concurrency:
  group: delete-merged-branches

jobs:
  delete-merged:
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh pr list --repo "$REPO" --state merged --limit 200 \
            --json number,headRefName,headRefOid,isCrossRepository \
            -q '.[] | select(.isCrossRepository | not) | "\(.number) \(.headRefName) \(.headRefOid)"' |
          while read -r num ref oid; do
            [ "$ref" = "main" ] && continue
            tip=$(gh api "repos/$REPO/git/ref/heads/$ref" -q .object.sha 2>/dev/null) || continue
            if [ "$tip" = "$oid" ]; then
              gh api -X DELETE "repos/$REPO/git/refs/heads/$ref" && echo "삭제: $ref (#$num)"
            else
              echo "유지: $ref (#$num 머지 후 새 커밋 있음)"
            fi
          done
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy homepage if relay/site changed since the last deploy
        # 자동 머지는 push 실행을 만들지 않아 deploy-site.yml이 저절로 돌지 않으므로 여기서 실행합니다.
        if: ${{ !cancelled() }}
        run: |
          changed=$(gh api "repos/$REPO/commits?sha=main&path=relay/site&per_page=1" -q '.[0].commit.committer.date // ""')
          deployed=$(gh run list --repo "$REPO" --workflow deploy-site.yml --branch main --status success --limit 1 --json createdAt -q '.[0].createdAt // ""' || true)
          if [ -n "$changed" ] && [[ "$changed" > "$deployed" ]]; then
            gh workflow run deploy-site.yml --repo "$REPO" --ref main && echo "소개 페이지 반영 실행 ($changed > ${deployed:-없음})"
          fi
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
