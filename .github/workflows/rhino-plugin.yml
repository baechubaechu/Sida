name: Rhino plugin

# Builds the Rhino plugin (rhino-plugin/) so a change that no longer compiles is seen on the PR.
# Not a required check: the plugin is tried in Rhino on a PC before a release.

on:
  pull_request:
    paths: ["rhino-plugin/**", "scripts/package_rhino_plugin.py", ".github/workflows/rhino-plugin.yml"]
  push:
    branches: [main]
    paths: ["rhino-plugin/**"]

jobs:
  build:
    runs-on: ubuntu-latest  # plain net7.0, so no Windows is needed to build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build rhino-plugin/SidaRhino/SidaRhino.csproj -c Release
      - name: Pack (Rhino's package and the bundle with install.bat)
        run: python3 scripts/package_rhino_plugin.py
      - uses: actions/upload-artifact@v4
        with:
          name: sida-rhino-plugin
          path: |
            rhino-plugin/dist/
            rhino-plugin/SidaRhino/bin/Release/net7.0/SidaRhino.rhp
