name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  web-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test web screen helpers (offline)
        run: node --test tests/webui/model.test.mjs tests/webui/board-model.test.mjs tests/webui/command-model.test.mjs tests/webui/talk-panel.test.mjs
      - name: Check browser scripts
        run: for f in webui/app/*.js; do node --check "$f"; done

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest, in parallel)
        run: pytest -n auto
