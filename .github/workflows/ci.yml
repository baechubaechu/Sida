name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  web-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test web screen helpers (offline)
        run: node --test tests/webui/model.test.mjs tests/webui/board-model.test.mjs prototypes/drafting-table/tests/history.test.mjs
      - name: Check browser scripts
        run: |
          node --check webui/app/app.js
          node --check webui/app/model.js
          node --check webui/app/board-model.js
          node --check webui/app/table.js

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: pytest
