name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  web-mockup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test web mockup (offline)
        run: node --test web-mockup/tests/model.test.mjs
      - name: Check browser scripts
        run: |
          node --check web-mockup/public/app.js
          node --check web-mockup/scripts/serve.mjs

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: pytest
