provider: openrouter

# Where user project folders are stored (easy to find in File Explorer)
# Default if omitted: ~/Sida/projects
projects_dir: ~/Sida/projects

# ---------------------------------------------------------------------------
# Local Conductor GPU tiers (Ollama / OpenAI-compatible local server)
# Default commercial target: 8GB VRAM → profile "local" (7B)
# Recommended: 12GB+ → profile "local_plus" (qwen3.5:9b — Korean + JSON + 16K ctx)
# Worker modules stay on OpenRouter unless you change worker.model.
# ---------------------------------------------------------------------------
local_profiles:
  # ~8GB VRAM (RTX 4060 / 3060 8GB / many laptops) — minimum / default
  local:
    model: qwen2.5:7b
    num_ctx: 8192
    temperature: 0.4
    max_tokens: 1400
    history_window: 12
  # ~12GB+ VRAM (3060 12G / 4070) — recommended Conductor tier
  local_plus:
    model: qwen3.5:9b         # ~6.6GB Q4; alts: gemma3:12b, gemma4-uncen:e4b
    num_ctx: 16384
    temperature: 0.4
    max_tokens: 2500
    history_window: 16

# Cheap always-on conversational model
conductor:
  # openrouter (default) | ollama | mock — ollama uses local_profiles[local_profile]
  provider: ollama
  local_profile: local_plus # local (8GB, 7B) | local_plus (12GB+, qwen3.5:9b)
  base_url: http://127.0.0.1:11434   # Ollama server (native /api/chat)
  # When provider=ollama: start server, optionally pull missing model, warm VRAM
  ollama_autostart: true
  ollama_pull_missing: ask          # ask | auto | off
  ollama_warmup: true
  ollama_keep_alive: 30m            # keep model in VRAM between turns
  ollama_wait_seconds: 45
  # Qwen3+ chain-of-thought: leave false or answers may be Empty LLM response
  ollama_think: false
  model: anthropic/claude-haiku-4.5
  temperature: 0.4
  max_tokens: 2000
  prompt: agents/00_conductor.md
  cache_ttl: 1h
  # When a reply has no ```action``` block, ask the model once more (JSON-only)
  # to extract the intended action. auto = local providers only | always | off
  action_recovery: auto
  # Rolling memory for long projects (tuned for 7B@8K / 9B@16K)
  context:
    state_file: project_state.md
    history_window: 12          # overridden by local_profile when provider=ollama
    prefer_state_over_modules: true   # use state takeaways instead of full module .md

# Specialist module model (only when a module runs)
# After each module run, propose a project_state.md patch (Module Status row,
# Meta lines, changed bullet sections) and show a diff.
#   mode: ask (diff + Y/n/e) | auto (apply silently) | off
#   provider: worker (cloud, reliable JSON) | conductor (fully local when provider=ollama)
state_update:
  mode: ask
  provider: conductor           # local when conductor.provider=ollama
  max_tokens: 1400
  temperature: 0.2

worker:
  provider: ollama              # openrouter | ollama | mock
  # model / num_ctx come from local_profiles[conductor.local_profile] when provider=ollama
  temperature: 0.3
  max_tokens: 2500

# Legacy sequential pipeline (run.py) uses worker settings via fallback
model: openai/gpt-4o-mini
temperature: 0.3
max_tokens: 2000

# ---------------------------------------------------------------------------
# RAG — local_files (dev) or http (VPS API). See docs/rag.md + docs/rag_api.md.
# ---------------------------------------------------------------------------
rag:
  enabled: true
  provider: http                 # http (VPS) | local_files (offline corpus)
  # base_url from SIDA_RAG_URL; Bearer from SIDA_RAG_API_KEY
  path: /v1/retrieve
  timeout: 30
  knowledge_dir: knowledge       # used only when provider=local_files
  top_k: 12
  max_chars: 14000
  agents:
    regulation_checker: regulation
  collections:
    regulation:
      path: regulations          # local_files → knowledge/regulations/
      top_k: 12
      max_chars: 14000
  # Hub → l (법령 검색): follow-up query expansion + higher recall
  law_search:
    top_k: 12
    max_chars: 14000
    multi_query: true

# ---------------------------------------------------------------------------
# Rhino modeling (hub → m). Separate from design projects / Conductor experts.
# OpenAI API only. Model must be GPT-6 or newer (default: gpt-6-astra).
# ---------------------------------------------------------------------------
modeling:
  provider: openai
  model: gpt-6-astra
  min_major: 6
  temperature: 0.2          # ignored for GPT-6+ (API rejects custom temperature)
  max_tokens: 2500
  max_rounds: 8
  auto_execute: true
  prompt: agents/71_rhino_modeler.md
  # mcp_command: null   # or full path to rhino-mcp-router.exe / env SIDA_RHINO_MCP
  mcp_timeout: 90

# ---------------------------------------------------------------------------
# Experts. Design is not linear: any expert can run alone, in any order.
#   phase   — lens group (analysis | concept | synthesis | development | critique | communication)
#   desc    — one line the Conductor shows / uses for routing
#   inputs  — prior outputs this expert reads when present ("all" = every completed output).
#             Other completed outputs are listed by name only, to save context.
# File/output numbering is grouped by phase (1x analysis, 2x concept, 3x synthesis,
# 4x development, 5x critique, 6x communication) — it is not an execution order.
# ---------------------------------------------------------------------------
agents:
  # --- analysis: what is given
  - id: site_reader
    file: agents/11_site_reader.md
    name: Site Reader
    output: 11_site_reader.md
    phase: analysis
    desc: geographic/spatial site reading — systems, conflicts, opportunities (not codes)
    inputs: [program_analyst, concept_framer]

  - id: program_analyst
    file: agents/12_program_analyst.md
    name: Program Analyst
    output: 12_program_analyst.md
    phase: analysis
    desc: users and rhythms, program components, adjacency, public-private gradient
    inputs: [site_reader, concept_framer]

  - id: regulation_checker
    file: agents/13_regulation_checker.md
    name: Regulation Checker
    output: 13_regulation_checker.md
    phase: analysis
    desc: site- and program-triggered codes, verify list, binding limits, incentives (KR default)
    inputs: [site_reader, program_analyst]

  - id: precedent_scout
    file: agents/14_precedent_scout.md
    name: Precedent Scout
    output: 14_precedent_scout.md
    phase: analysis
    desc: precedents and typologies matched to the problem, lessons and cautions
    inputs: [concept_framer, site_reader]

  # --- concept: what the designer claims
  - id: concept_framer
    file: agents/21_concept_framer.md
    name: Concept Framer
    output: 21_concept_framer.md
    phase: concept
    desc: sharpen the designer's idea into a testable concept and operative strategy
    inputs: [site_reader, program_analyst, precedent_scout]

  # --- synthesis: put lenses together
  - id: constraint_mapper
    file: agents/31_constraint_mapper.md
    name: Constraint Mapper
    output: 31_constraint_mapper.md
    phase: synthesis
    desc: hard/soft constraints, priorities, tensions — integrates site + program + regulation
    inputs: [site_reader, program_analyst, regulation_checker]

  - id: synthesizer
    file: agents/32_synthesizer.md
    name: Synthesizer
    output: 32_synthesizer.md
    phase: synthesis
    desc: reconcile all expert outputs — convergences, conflicts, decisions required now
    inputs: all

  # --- development: does the scheme work
  - id: spatial_reviewer
    file: agents/41_spatial_reviewer.md
    name: Spatial Reviewer
    output: 41_spatial_reviewer.md
    phase: development
    desc: test the described organization — circulation, section, thresholds, program fit
    inputs: [concept_framer, constraint_mapper, site_reader, program_analyst]

  - id: systems_advisor
    file: agents/42_systems_advisor.md
    name: Systems Advisor
    output: 42_systems_advisor.md
    phase: development
    desc: structure, envelope, services, egress questions and trade-offs (no sizing)
    inputs: [spatial_reviewer, constraint_mapper, regulation_checker, site_reader]

  # --- critique
  - id: design_critic
    file: agents/51_design_critic.md
    name: Design Critic
    output: 51_design_critic.md
    phase: critique
    desc: jury-style critique of the direction against the core problem
    inputs: all

  # --- communication
  - id: representation_planner
    file: agents/61_representation_planner.md
    name: Representation Planner
    output: 61_representation_planner.md
    phase: communication
    desc: which diagrams, drawings, models prove the concept and test weak points
    inputs: [concept_framer, spatial_reviewer, design_critic, site_reader]

  - id: presentation_editor
    file: agents/62_presentation_editor.md
    name: Presentation Editor
    output: 62_presentation_editor.md
    phase: communication
    desc: review / portfolio story, structure, anticipated questions
    inputs: [concept_framer, synthesizer, design_critic, representation_planner]

# Suggested entry paths by what drives the project. The Conductor treats these as
# hints, not sequences. `python run.py --path <name> brief.md` runs one in order.
paths:
  site_driven: [site_reader, program_analyst, regulation_checker, constraint_mapper, concept_framer, design_critic]
  idea_driven: [concept_framer, precedent_scout, site_reader, program_analyst, spatial_reviewer, design_critic]
  program_driven: [program_analyst, site_reader, regulation_checker, constraint_mapper, concept_framer, spatial_reviewer]
  regulation_driven: [regulation_checker, program_analyst, site_reader, constraint_mapper, spatial_reviewer, systems_advisor]
  review_prep: [synthesizer, design_critic, representation_planner, presentation_editor]
