# What the 법규 볼륨 (sida/experts/site/envelope.py) applies besides 정북일조 (data/site_rules.yaml):
# 대지 안의 공지, 공동주택 채광, 건축선. The app reads only this file when it works the envelope
# out: nothing is fetched at run time (2026-11-17 지훈 "할때마다 읽어오는건 안돼"). Every figure
# here was copied from the 원문 on law.go.kr; when a statute or ordinance changes, compare it again
# and update its `verified` date. Distances are metres.

# 건물 용도 the designer picks on the card. `group` ties a pick to the rows below; `housing` marks
# 공동주택 (채광 applies); `area` says the rows depend on the floor area of that use.
uses:
  apartment: {label: 아파트, group: apartment, housing: true}
  apartment_city: {label: "아파트(도시형 생활주택)", group: apartment_city, housing: true}
  row_house: {label: 연립주택, group: row_house, housing: true}
  multiplex: {label: 다세대주택, group: multiplex, housing: true}
  sales: {label: "판매·숙박시설(일반숙박 제외)", group: sales, area: true}
  care: {label: "의료·운동·관광휴게시설", group: care, area: true}
  culture: {label: "문화·집회(전시장·동식물원 제외)·종교·장례시설", group: culture, area: true}
  factory: {label: 공장, group: factory, area: true}
  warehouse: {label: 창고, group: warehouse, area: true}
  other: {label: "단독주택·근린생활시설 등 그 밖", group: other}

# 대지 안의 공지 (건축법 제58조, 시행령 제80조의2 [별표 2], 시·도 건축 조례). Each row: `uses`
# (groups), optional `area_min`/`area_max` (㎡ of that use, the max not included), `zones_not`
# (words: the row does not apply in a zone whose name holds one), `zones` (words: only there),
# and `m` (one distance) or `by_zone` ([[word, m], ..., [null, m]]: the first word the zone's name
# holds, null for the rest). The first row that fits gives the distance; none fits: 0.
open_space:
  law: 건축법 제58조, 시행령 제80조의2 [별표 2]
  text: >-
    건축물을 건축하는 경우에는 「국토의 계획 및 이용에 관한 법률」에 따른 용도지역·용도지구, 건축물의 용도 및
    규모 등에 따라 건축선 및 인접 대지경계선으로부터 6미터 이내의 범위에서 대통령령으로 정하는 바에 따라
    해당 지방자치단체의 조례로 정하는 거리 이상을 띄워야 한다.
  # The statute's ranges ([별표 2], 개정 2021. 11. 2.): an ordinance sets a distance in each; where
  # no ordinance is in this file the least of the range is used and the line says "확인 필요".
  # 대통령령 제36817호(2026-11-12 시행)의 [별표 2]와 대조.
  statute:
    building_line:
      - {uses: [factory], area_min: 500, zones_not: [전용공업, 일반공업], by_zone: [[준공업, 1.5], [null, 3]],
         text: "가. 바닥면적 합계 500제곱미터 이상인 공장(전용공업지역, 일반공업지역, 산업단지 제외): 준공업지역 1.5미터 이상 6미터 이하, 그 외 3미터 이상 6미터 이하"}
      - {uses: [warehouse], area_min: 500, zones_not: [전용공업, 일반공업], by_zone: [[준공업, 1.5], [null, 3]],
         text: "나. 바닥면적 합계 500제곱미터 이상인 창고(전용공업지역, 일반공업지역, 산업단지 제외): 준공업지역 1.5미터 이상 6미터 이하, 그 외 3미터 이상 6미터 이하"}
      - {uses: [sales, culture], area_min: 1000, m: 3,
         text: "다. 바닥면적 합계 1,000제곱미터 이상인 판매시설, 숙박시설(일반숙박시설 제외), 문화 및 집회시설(전시장 및 동·식물원 제외) 및 종교시설: 3미터 이상 6미터 이하"}
      - {uses: [apartment, apartment_city], m: 2, text: "마. 공동주택 아파트: 2미터 이상 6미터 이하"}
      - {uses: [row_house], m: 2, text: "마. 공동주택 연립주택: 2미터 이상 5미터 이하"}
      - {uses: [multiplex], m: 1, text: "마. 공동주택 다세대주택: 1미터 이상 4미터 이하"}
      - {uses: [other, care, culture, sales, factory, warehouse], m: 1,
         text: "바. 그 밖에 건축조례로 정하는 건축물: 1미터 이상 6미터 이하(조례가 정한 건축물만)"}
    neighbour:
      - {uses: [other, sales, care, culture, factory, warehouse], zones: [전용주거], m: 1,
         text: "가. 전용주거지역에 건축하는 건축물(공동주택 제외): 1미터 이상 6미터 이하"}
      - {uses: [factory], area_min: 500, zones_not: [전용공업, 일반공업], by_zone: [[준공업, 1], [null, 1.5]],
         text: "나. 바닥면적 합계 500제곱미터 이상인 공장(전용공업지역, 일반공업지역, 산업단지 제외): 준공업지역 1미터 이상 6미터 이하, 그 외 1.5미터 이상 6미터 이하"}
      - {uses: [sales, culture], area_min: 1000, zones_not: [상업], m: 1.5,
         text: "다. 상업지역이 아닌 지역의 바닥면적 합계 1,000제곱미터 이상인 판매시설, 숙박시설(일반숙박시설 제외), 문화 및 집회시설(전시장 및 동·식물원 제외) 및 종교시설: 1.5미터 이상 6미터 이하"}
      - {uses: [apartment, apartment_city], m: 2, text: "마. 공동주택 아파트: 2미터 이상 6미터 이하(상업지역의 스프링클러 설치 공동주택 제외)"}
      - {uses: [row_house], m: 1.5, text: "마. 공동주택 연립주택: 1.5미터 이상 5미터 이하(상업지역의 스프링클러 설치 공동주택 제외)"}
      - {uses: [multiplex], m: 0.5, text: "마. 공동주택 다세대주택: 0.5미터 이상 4미터 이하(상업지역의 스프링클러 설치 공동주택 제외)"}
      - {uses: [other, care, culture, sales, factory, warehouse], m: 0.5,
         text: "바. 그 밖에 건축조례로 정하는 건축물: 0.5미터 이상 6미터 이하(조례가 정한 건축물만)"}
  # 시·도 건축 조례의 거리 (the 시·도 name as the site facts' municipality starts).
  regions:
    서울특별시:
      source: "서울특별시 건축 조례 제30조 [별표 4]"
      # 서울특별시조례 제10170호(2026-11-12 시행), [별표 4] 개정 2025. 5. 19.
      verified: 2026-11-17
      building_line:
        - {uses: [factory, warehouse], area_min: 500, zones_not: [전용공업, 일반공업], by_zone: [[준공업, 1.5], [null, 3]],
           text: "가. 공장, 창고(전용공업지역·일반공업지역·산업단지 제외) 500제곱미터 이상: 준공업지역 1.5미터 이상, 그 외 3미터 이상"}
        - {uses: [sales, care], area_min: 1000, m: 3,
           text: "나. 판매시설, 숙박시설(일반숙박시설 제외), 의료시설, 운동시설 및 관광휴게시설 1,000제곱미터 이상: 3미터 이상"}
        - {uses: [culture], area_min: 1000, m: 3, text: "다. 문화 및 집회시설(전시장 및 동·식물원 제외), 종교시설, 장례식장 1,000제곱미터 이상: 3미터 이상"}
        - {uses: [culture], area_max: 1000, m: 1, text: "다. 문화 및 집회시설(전시장 및 동·식물원 제외), 종교시설, 장례식장 1,000제곱미터 미만: 1미터 이상"}
        - {uses: [apartment], m: 3, text: "마. 공동주택 아파트: 3미터 이상"}
        - {uses: [apartment_city], m: 2, text: "마. 공동주택 아파트: 3미터 이상 단, 도시형생활주택(아파트형)은 2미터 이상"}
        - {uses: [row_house], m: 2, text: "마. 공동주택 연립주택: 2미터 이상"}
        - {uses: [multiplex], m: 1, text: "마. 공동주택 다세대주택: 1미터 이상"}
      neighbour:
        - {uses: [other, sales, care, culture, factory, warehouse], zones: [전용주거], m: 1,
           text: "가. 전용주거지역에 건축하는 건축물(공동주택 제외): 1미터 이상"}
        - {uses: [factory], area_min: 500, zones_not: [전용공업, 일반공업], by_zone: [[준공업, 1], [null, 1.5]],
           text: "나. 공장, 자동차관련시설, 위험물 저장 및 처리시설(전용공업지역·일반공업지역·산업단지 제외) 500제곱미터 이상: 준공업지역 1미터 이상, 그 외 1.5미터 이상"}
        - {uses: [sales, culture], area_min: 1000, zones_not: [상업], m: 1.5,
           text: "다. 판매시설, 숙박시설(일반숙박시설 제외), 문화 및 집회시설(전시장 및 동ㆍ식물원 제외) 및 종교시설, 장례식장(상업지역 제외) 1,000제곱미터 이상: 1.5미터 이상"}
        - {uses: [sales, culture], area_max: 1000, zones_not: [상업], m: 1,
           text: "다. 판매시설, 숙박시설(일반숙박시설 제외), 문화 및 집회시설(전시장 및 동ㆍ식물원 제외) 및 종교시설, 장례식장(상업지역 제외) 1,000제곱미터 미만: 1미터 이상"}
        - {uses: [apartment], m: 3, text: "라. 공동주택 아파트: 3미터 이상(상업지역의 스프링클러 설치 공동주택 제외)"}
        - {uses: [apartment_city], m: 2, text: "라. 공동주택 아파트: 3미터 이상 단, 도시형생활주택(아파트형)은 2미터 이상"}
        - {uses: [row_house], m: 1.5, text: "라. 공동주택 연립주택: 1.5미터 이상"}
        - {uses: [multiplex], m: 1, text: "라. 공동주택 다세대주택: 1미터 이상"}
  # The parcels across which the 인접 대지경계선 is the far one (시행령 제80조의2: 공원, 철도, 하천,
  # 광장, 공공공지, 녹지 …), by the 지목 mark of the 연속지적 map: no 인접 setback is drawn on that side.
  across_marks: {철: 철도용지, 천: 하천, 공: 공원}
  verified: 2026-11-17

# 공동주택 채광 (건축법 제61조②, 시행령 제86조③1): each part of a 공동주택 (일반상업·중심상업지역
# 제외) at most `times` its horizontal distance from the window wall to the 인접 대지경계선, 4 times
# in 근린상업지역·준주거지역. The windows' sides are not known yet, so every 인접 대지경계선 is
# taken as one a window faces (the strictest reading). Across a road, railway, river or park
# (data/site_rules.yaml across_marks) the line is the middle of that parcel (제86조⑥: 공동주택은
# 중심선). A 다세대주택 whose window walls stand at least the ordinance's distance (1미터 이상) from
# the line is left out (제86조③ 단서): `multiplex_free` by 시·도, the walls kept that far instead.
daylight:
  law: 건축법 제61조제2항, 시행령 제86조제3항제1호
  text: >-
    건축물(기숙사는 제외한다)의 각 부분의 높이는 그 부분으로부터 채광을 위한 창문 등이 있는 벽면에서 직각 방향으로
    인접 대지경계선까지의 수평거리의 2배(근린상업지역 또는 준주거지역의 건축물은 4배) 이하로 할 것
  times: 2
  times_by_zone: [[근린상업, 4], [준주거, 4]]
  zones_not: [일반상업, 중심상업]
  multiplex_free:
    서울특별시: {m: 1, source: "서울특별시 건축 조례 제35조제3항"}
  # 대통령령 제36817호(2026-11-12 시행) 제86조③(마지막 개정 2024.6.18), 서울특별시 건축 조례 제35조③
  verified: 2026-11-17

# 건축선 (건축법 제46조, 시행령 제31조). A road narrower than `least_road` (법 제2조①11호: 4미터)
# moves the line back to `least_road / 2` from the road's middle; at a corner of two roads narrower
# than 8 m meeting at under 120°, the corner is cut along each road by the table's distance
# (시행령 제31조①: 교차각, 해당 도로의 너비, 교차되는 도로의 너비).
building_line:
  law: 건축법 제46조제1항, 시행령 제31조제1항
  least_road: 4
  corner:
    # [angle under, crossing road from, crossing road under, this road from, this road under, m]
    - [90, 6, 8, 6, 8, 4]
    - [90, 6, 8, 4, 6, 3]
    - [90, 4, 6, 6, 8, 3]
    - [90, 4, 6, 4, 6, 2]
    - [120, 6, 8, 6, 8, 3]
    - [120, 6, 8, 4, 6, 2]
    - [120, 4, 6, 6, 8, 2]
    - [120, 4, 6, 4, 6, 2]
  # 법률 제21880호·대통령령 제36817호(2026-11-12 시행)와 대조, 제46조·제31조 바뀐 것 없음
  verified: 2026-11-17
