# 용도지역별 건폐율·용적률 법정 범위 (전국 공통).
# 실제 적용값은 시·군 도시계획조례가 이 범위 안에서 정합니다. 여기 값은 "법정 상한"으로만 씁니다.
#
# 출처: 국토의 계획 및 이용에 관한 법률 시행령 제84조제1항(건폐율), 제85조제1항(용적률)
# 원문 대조: 2026-10-01 (시행 2026-09-18 기준 조문). 개정되면 이 파일과 verified 날짜를 같이 고칩니다.
source:
  bcr: 국토의 계획 및 이용에 관한 법률 시행령 제84조제1항
  far: 국토의 계획 및 이용에 관한 법률 시행령 제85조제1항
  verified: "2026-10-01"

# bcr_max: 건폐율 상한(%), far_min / far_max: 용적률 범위(%)
zones:
  제1종전용주거지역: {bcr_max: 50, far_min: 50, far_max: 100}
  제2종전용주거지역: {bcr_max: 50, far_min: 50, far_max: 150}
  제1종일반주거지역: {bcr_max: 60, far_min: 100, far_max: 200}
  제2종일반주거지역: {bcr_max: 60, far_min: 100, far_max: 250}
  제3종일반주거지역: {bcr_max: 50, far_min: 100, far_max: 300}
  준주거지역: {bcr_max: 70, far_min: 200, far_max: 500}
  중심상업지역: {bcr_max: 90, far_min: 200, far_max: 1500}
  일반상업지역: {bcr_max: 80, far_min: 200, far_max: 1300}
  근린상업지역: {bcr_max: 70, far_min: 200, far_max: 900}
  유통상업지역: {bcr_max: 80, far_min: 200, far_max: 1100}
  전용공업지역: {bcr_max: 70, far_min: 150, far_max: 300}
  일반공업지역: {bcr_max: 70, far_min: 150, far_max: 350}
  준공업지역: {bcr_max: 70, far_min: 150, far_max: 400}
  보전녹지지역: {bcr_max: 20, far_min: 50, far_max: 80}
  생산녹지지역: {bcr_max: 20, far_min: 50, far_max: 100}
  자연녹지지역: {bcr_max: 20, far_min: 50, far_max: 100}
  보전관리지역: {bcr_max: 20, far_min: 50, far_max: 80}
  생산관리지역: {bcr_max: 20, far_min: 50, far_max: 80}
  계획관리지역: {bcr_max: 40, far_min: 50, far_max: 100}
  농림지역: {bcr_max: 20, far_min: 50, far_max: 80}
  자연환경보전지역: {bcr_max: 20, far_min: 50, far_max: 80}

# 위 용도지역을 묶는 상위 분류. 정보가 없어서 목록에 따로 적지 않습니다.
umbrella:
  - 도시지역
  - 주거지역
  - 상업지역
  - 공업지역
  - 녹지지역
  - 관리지역

# 지역·지구 이름에 이 낱말이 들어 있으면 "확인 필요"로 표시합니다.
# 법정 상한이나 용도지역만으로는 판단할 수 없고, 따로 정한 계획·고시를 봐야 하는 경우입니다.
verify:
  - keyword: 지구단위계획
    note: 지구단위계획이 건폐율·용적률·높이·용도를 따로 정할 수 있음 — 결정 고시와 지침도 확인
  - keyword: 개발제한구역
    note: 개발제한구역은 건축이 원칙적으로 제한됨 — 개발제한구역법상 허용 행위 확인
  - keyword: 정비구역
    note: 정비계획이 밀도와 용도를 따로 정함 — 정비계획 고시 확인
  - keyword: 재정비촉진
    note: 재정비촉진계획이 밀도와 용도를 따로 정함 — 계획 고시 확인
  - keyword: 고도지구
    note: 건축물 높이의 최고 또는 최저 한도가 정해져 있음 — 도시관리계획 결정 내용 확인
  - keyword: 경관지구
    note: 높이·형태·색채 등 경관 기준이 조례로 정해짐 — 해당 조례 확인
  - keyword: 방화지구
    note: 주요구조부와 외벽을 내화구조로 해야 함(건축법 제51조) — 건폐율 완화 대상인지도 확인
  - keyword: 역사문화환경
    note: 국가유산 주변 현상변경 허용기준에 따라 높이·형태가 제한될 수 있음 — 허용기준 고시 확인
  - keyword: 문화재
    note: 국가유산 주변 현상변경 허용기준에 따라 높이·형태가 제한될 수 있음 — 허용기준 고시 확인
  - keyword: 문화유산
    note: 국가유산 구역 또는 보호구역임 — 현상변경 허가 대상인지 확인
  - keyword: 건축선
    note: 건축선이 따로 지정되어 있음 — 후퇴 범위와 건축 가능 범위 확인
  - keyword: 대공방어
    note: 위탁고도 이상으로 건축하면 군 협의 대상 — 높이 확인
  - keyword: 비오톱
    note: 도시생태현황도 비오톱 등급에 따라 개발행위가 제한될 수 있음 — 조례 확인
  - keyword: 도시자연공원구역
    note: 도시자연공원구역은 건축이 원칙적으로 제한됨 — 허용 행위 확인
  - keyword: 비행안전
    note: 군사기지법에 따른 높이 제한 — 관할 부대 협의 대상인지 확인
  - keyword: 군사
    note: 군사기지 및 군사시설 보호법에 따른 건축 협의 대상일 수 있음 — 확인
  - keyword: 철도보호지구
    note: 철도 경계선 30m 이내 행위는 신고 대상(철도안전법 제45조) — 확인
  - keyword: 하천구역
    note: 하천법상 점용허가 없이는 건축 불가 — 하천구역 경계 확인
  - keyword: 토지거래계약에관한허가구역
    note: 토지 거래에 허가가 필요함(설계 기준은 아님)
