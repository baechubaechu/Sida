# 고도지구 높이 (sida/experts/site/height_districts.py): the heights a 고도지구 notice sets, by zone.
# The government's data names the notice of each 고도지구 piece (VWorld LT_C_UQ123: dyear, dnum) but
# not its height, which is only in the notice's own tables. Those tables are copied here once and
# checked by a person; the app reads only this file (2026-11-17 지훈 "할때마다 읽어오는건 안돼").
# A notice whose `verified` is null is shown but does not cut the envelope.
#
# Zone fields: number (도면표시번호), limit (원문 그대로), max_m (m), max_floors (층수로 정한 구역: 볼륨을 그 층수까지), base: ground(지표면, 높이 산정은 height_rule) | road
# (도로면 기준, road_offset_m) | sea(해발), relaxed_m (비고의 완화: 위원회 심의를 거쳐야 하므로 자동 적용
# 하지 않음), area_m2 (조서의 면적, VWorld 조각과 짝짓는 데 씀), location (조서의 위치).
# kept: 이 고시에 기정 행만 있는 구역(바뀌지 않음). VWorld는 이 구역을 예전 고시 번호로 그려 두므로, 표에 없는
#   번호의 조각이라도 같은 구의 kept 구역과 넓이·지번이 맞으면 그 구역으로 봄.
# minimum_m: 최저고도(그 높이 이상으로 지어야 함, 볼륨 상한 아님), minimum_source: 그 근거 원문. superseded_by: 뒤 고시로
#   바뀐 행(짝짓기에 쓰지 않음). old: 이 고시가 번호를 새로 매기기 전 번호.
# public_land_max_m: 국·공유지(토지소유정보의 소유구분)이면 이 높이. zoning: 이 구역이 해당하는 용도지역(사유서).

notices:
  - notice: 서울특별시 고시 제2024-317호
    notice_date: 2024-06-27
    region: 서울특별시
    # 토지이음 고시정보 seq=590707, 첨부 "서울특별시_제2024-317호_고시.pdf" 1~8쪽(글자 층이 없어 쪽 그림을
    # 읽어 옮김). 검산: 지구별 면적 합계가 사유서의 변경 후 면적과 모두 일치(남산 2,809,828 / 북한산
    # 2,352,498 / 구기·평창 431,559 / 경복궁 996,121 ㎡). 기정 행만 있는 구역(남산 7~14, 경복궁 1)은
    # 합계에 들어가므로 계속 유효.
    vworld: {layer: LT_C_UQ123, dyear: "2024", dnum: "0317"}
    # 이 고시의 구역인데 VWorld가 다른 번호로 그리는 조각: 그 번호의 조각은 여기 적은 지구의 구역으로만 맞춤.
    # 2023-1986: 북한산 주변(강북구·도봉구)의 조각이 모두 이 번호(2026-11-18 우이동 100-1 등 실제 조회). 토지이음
    # 고시정보에 이 번호의 고시는 없고, 토지이용계획의 관리번호(manageNo 6110000·11305·2023·1986…)에 들어 있는
    # 번호임. 2024-317호의 북한산 기정 행은 '90.12.10 제404호뿐이라 그 사이 높이를 바꾼 고시는 없고, 토지이음
    # 확인도면 범례도 우이동 100-1(2종 7층이하)에 "고도지구(28m이하)"로 이 고시의 2번 구역과 같음.
    vworld_also:
      - {dyear: "2023", dnum: "1986", districts: [북한산 주변]}
    verified: 2026-11-17  # 지훈이 쪽 그림과 줄마다 대조(대조 페이지), 변경 행 없는 구역은 기정값 그대로
    height_rule: >-
      지표면으로부터 건물 최상단까지의 높이[단, 지표면 산정방법은 건축법령을 따르되, 건물 옥상돌출부,
      옥상돌출물 및 필로티는 높이에 포함하며, 옥상에 설치되는 높이 3m 이내의 승강기탑·계단탑 및
      난간벽(투시형 또는 그 벽면적의 2분의1 이상이 공간으로 되고 높이 1.5m 미만인 것에 한정)은 제외]
    rooftop_allowance_m: 3  # height_rule의 단서: 옥상 승강기탑·계단탑·투시형 난간은 3m 이내면 높이에 넣지 않음
    districts:
      남산 주변:
        total_m2: 2809828
        zones:
          - {number: 1,  location: 용산구 소월로 일대, limit: 도로면 이하, base: road, road_offset_m: 0, area_m2: 135000}
