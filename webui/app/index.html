<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#36536b">
  <meta name="description" content="Sida — 건축 설계 프로젝트와 전문가 대화">
  <title>Sida · 프로젝트</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/app/vendor/leaflet.css">
  <link rel="stylesheet" href="/app/styles.css">
  <script type="module" src="/app/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 이동</a>
  <div id="app"></div>
  <div id="table-host" class="table-host" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <form method="dialog" id="settings-form">
      <div class="dialog-heading"><h2 id="settings-title">설정</h2><button type="button" class="icon-button" data-settings="close" aria-label="설정 닫기"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M5 5l10 10M15 5 5 15"/></svg></button></div>
      <div id="settings-body"><p class="muted">설정을 불러오는 중입니다.</p></div>
      <div class="settings-footer" id="settings-footer">
        <p class="settings-dirty" id="settings-dirty" aria-live="polite"></p>
        <p class="error-text" id="settings-error" role="alert"></p>
        <button type="button" class="secondary" data-settings="discard" id="settings-discard" hidden>변경 버리기</button>
        <button type="button" class="primary" data-settings="save">저장</button>
      </div>
    </form>
  </dialog>
  <dialog id="delete-dialog" aria-labelledby="delete-title" aria-describedby="delete-text">
    <form method="dialog" id="delete-form">
      <h2 id="delete-title">프로젝트 삭제</h2>
      <p id="delete-text"></p>
      <p class="form-error error-text" id="delete-error" role="alert"></p>
      <div class="form-actions"><button class="secondary" value="cancel" autofocus>취소</button>
        <button type="button" class="primary danger" id="delete-confirm">삭제</button></div>
    </form>
  </dialog>
  <dialog id="project-info-dialog" aria-labelledby="project-info-title">
    <form id="project-info-form">
      <div class="dialog-heading"><h2 id="project-info-title">프로젝트 정보</h2><button type="button" class="icon-button" id="project-info-close" aria-label="프로젝트 정보 닫기"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M5 5l10 10M15 5 5 15"/></svg></button></div>
      <div id="project-info-body"></div>
    </form>
  </dialog>
  <dialog id="delete-talk-dialog" aria-labelledby="delete-talk-title" aria-describedby="delete-talk-text">
    <h2 id="delete-talk-title">Conductor 대화 삭제</h2>
    <p id="delete-talk-text"></p>
    <p class="form-error error-text" role="alert"></p>
    <div class="form-actions"><button type="button" class="secondary" id="delete-talk-cancel" autofocus>취소</button><button type="button" class="primary danger" id="delete-talk-confirm">삭제</button></div>
  </dialog>
</body>
</html>
