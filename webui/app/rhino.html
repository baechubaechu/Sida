<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#36536b">
  <title>Sida · 라이노</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/app/styles.css">
  <link rel="stylesheet" href="/app/rhino.css">
  <script type="module" src="/app/rhino-panel.js"></script>
</head>
<!-- The Sida panel inside Rhino (the plugin shows this page in a web view; it also opens in a
     browser beside Rhino). It talks to Sida only: /api/rhino/live, /api/rhino/commands and /api/rhino/prefs. -->
<body class="rhino-panel">
  <main id="panel">
    <header class="rp-head" id="rp-head"></header>
    <nav class="rp-tabs" id="rp-tabs" role="tablist" aria-label="패널 보기"></nav>
    <p class="rp-status" id="rp-status" role="status"></p>
    <section class="rp-figures" id="rp-figures" aria-label="Sida가 계산한 수치"></section>
    <section class="rp-layers" id="rp-layers" aria-label="레이어 의미"></section>
    <section class="rp-diagrams" id="rp-diagrams" aria-label="다이어그램 그리기"></section>
    <section class="rp-chat" id="rp-chat" aria-label="Sida와 나눈 대화" aria-live="polite"></section>
  </main>
  <footer class="rp-foot" id="rp-foot"></footer>
  <form class="rp-ask" id="rp-ask" hidden>
    <p class="rp-with" id="rp-with"></p>
    <label class="rp-view"><input type="checkbox" id="rp-view"> 지금 보이는 뷰도 같이 보내기</label>
    <textarea id="rp-question" rows="2" maxlength="4000" aria-label="Sida에게 물을 내용" aria-describedby="rp-with" placeholder="지금 모델을 두고 물어보세요"></textarea>
    <div class="rp-ask-row">
      <button type="button" class="rp-more" id="rp-new-talk" hidden>새 대화 시작</button>
      <span class="rp-keys">Enter 보내기, Shift+Enter 줄 바꿈</span>
      <button type="submit" class="primary" id="rp-send">보내기</button>
    </div>
  </form>
</body>
</html>
