<!-- The Sida panel inside Rhino (the plugin shows this page in a web view; it also opens in a
     browser beside Rhino). It talks to Sida only: /api/rhino/live and /api/rhino/commands. -->
<body class="rhino-panel">
  <main id="panel">
    <header class="rp-head" id="rp-head"></header>
    <p class="rp-status" id="rp-status" role="status"></p>
    <section class="rp-figures" id="rp-figures" aria-label="Sida가 계산한 수치"></section>
    <section class="rp-layers" id="rp-layers" aria-label="레이어 의미"></section>
    <section class="rp-diagrams" id="rp-diagrams" aria-label="다이어그램 그리기"></section>
  </main>
  <footer class="rp-foot" id="rp-foot"></footer>
</body>
